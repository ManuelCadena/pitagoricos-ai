<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Turrell-inspired radial gradients: soft, atmospheric -->
    <radialGradient id="skyGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(219, 234, 254);stop-opacity:1" />
      <stop offset="40%" style="stop-color:rgb(191, 219, 254);stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:rgb(147, 197, 253);stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:rgb(165, 180, 252);stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="twilightGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgb(165, 180, 252);stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:rgb(192, 132, 252);stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:rgb(219, 234, 254);stop-opacity:0" />
    </radialGradient>
    
    <!-- Soft blur for depth -->
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
    
    <filter id="subtleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>
  
  <!-- Background: pure white -->
  <rect width="1200" height="1200" fill="rgb(250, 250, 250)" />
  
  <!-- Outer light field -->
  <circle cx="600" cy="600" r="550" fill="url(#skyGradient)" filter="url(#softGlow)" opacity="0.6" />
  
  <!-- Middle light field -->
  <circle cx="600" cy="600" r="400" fill="url(#twilightGradient)" filter="url(#softGlow)" opacity="0.5" />
  
  <!-- Inner light field -->
  <circle cx="600" cy="600" r="250" fill="url(#skyGradient)" filter="url(#subtleGlow)" opacity="0.4" />
  
  <!-- Geometric center: minimal circle (Tetractys abstracted) -->
  <circle cx="600" cy="600" r="180" fill="none" stroke="rgb(147, 197, 253)" stroke-width="1" opacity="0.3" />
  <circle cx="600" cy="600" r="120" fill="none" stroke="rgb(165, 180, 252)" stroke-width="1" opacity="0.4" />
  <circle cx="600" cy="600" r="60" fill="none" stroke="rgb(192, 132, 252)" stroke-width="1" opacity="0.5" />
  
  <!-- Central point -->
  <circle cx="600" cy="600" r="4" fill="rgb(147, 197, 253)" opacity="0.6" />
</svg>
