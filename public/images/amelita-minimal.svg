<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft gradient for contemplative presence -->
    <radialGradient id="presence" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgb(165, 180, 252);stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:rgb(147, 197, 253);stop-opacity:0" />
    </radialGradient>
    
    <!-- Subtle glow -->
    <filter id="gentleGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" />
    </filter>
  </defs>
  
  <!-- Background: pure white -->
  <rect width="400" height="400" fill="rgb(250, 250, 250)" />
  
  <!-- Presence field -->
  <circle cx="200" cy="180" r="140" fill="url(#presence)" filter="url(#gentleGlow)" />
  
  <!-- Minimal geometric representation: circle (wholeness) -->
  <circle cx="200" cy="180" r="80" fill="none" stroke="rgb(147, 197, 253)" stroke-width="1" opacity="0.6" />
  
  <!-- Inner circle (soul) -->
  <circle cx="200" cy="180" r="40" fill="none" stroke="rgb(165, 180, 252)" stroke-width="1" opacity="0.7" />
  
  <!-- Center point (essence) -->
  <circle cx="200" cy="180" r="3" fill="rgb(147, 197, 253)" opacity="0.8" />
  
  <!-- Subtle text: name -->
  <text x="200" y="320" font-family="Inter, sans-serif" font-size="18" font-weight="300" fill="rgb(71, 85, 105)" text-anchor="middle" letter-spacing="2">
    AMELITA
  </text>
</svg>
